name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Type check frontend
        run: npx tsc -b

      - name: Install commerce API deps
        run: npm --prefix backend/functions ci

      - name: Build commerce API
        run: npm --prefix backend/functions run build

      - name: Validate hosting and payment adapters
        run: node --test backend/functions/test/free-hosting.test.cjs backend/functions/test/intasend.test.cjs backend/functions/test/vercel.test.cjs

      - name: Install server deps
        run: npm --prefix server ci

      - name: Generate knowledge base
        run: npm --prefix server run generate:knowledge
